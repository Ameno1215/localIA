# Configuration de la suite de tests de charge et de limites (voir bench/README.md).
#
# Un « profil » décrit une installation : où sont la passerelle LiteLLM, les serveurs vLLM,
# la pile RAG, et quelle charge lui envoyer. On choisit le profil avec --profil ou BENCH_PROFIL.
# Les « rôles » (code-agent, fast, vision) sont ceux du benchmark ; chaque rôle pointe vers
# un nom de modèle LiteLLM et, pour la phase 1, vers son serveur vLLM direct.

profil_defaut = "pc-test"

# Objectifs de service (SLO) et critères go / no-go du benchmark, communs à tous les profils.
# Un profil peut en redéfinir une partie dans sa propre section [profils.<nom>.slo].
[slo]
ttft_chaud_s = 3.0          # TTFT p95 d'un tour suivant (préfixe en cache)
ttft_froid_64k_s = 45.0     # TTFT p95 d'un prompt froid de 64K tokens (proportionnel en dessous)
itl_p99_ms = 150.0          # latence inter-tokens p99
taux_erreur = 0.005         # 0,5 % toutes causes
surcout_litellm_p95_ms = 50.0
rerank_p95_ms = 500.0       # 50 candidats
recherche_p95_ms = 200.0    # requête vectorielle
rappel5 = 0.85              # rappel@5 RAG avec reranker
genou_code_agent = 15       # sessions simultanées à 32K, TPOT p95 tenu
genou_fast = 30             # requêtes simultanées, TPOT p95 tenu
reprise_max_s = 600         # modèle revenu en moins de 10 min
derive_endurance = 0.10     # latence p95 à moins de 10 % de la première heure
frequence_min_mhz = 1400
acpi_max_c = 90.0
taux_outils_invalides = 0.02
qualite_min = 0.5           # part de tickets internes résolus (phase 7) ; à fixer par l'équipe

[slo.vitesse_min]           # tok/s par requête au 95e centile (le plus lent)
code-agent = 20.0
fast = 50.0
vision = 10.0

# ---------------------------------------------------------------------------
# PC de test actuel : un seul vLLM (qwen-local, Qwen3.5-4B, 2 séquences max).
# Seuils revus à la baisse : le but ici est de valider la suite, pas la machine.
# ---------------------------------------------------------------------------
[profils.pc-test]
passerelle = "http://localhost:4000"
metriques = ["http://localhost:8000/metrics"]

[profils.pc-test.roles.code-agent]
modele = "qwen-local"
direct = "http://localhost:8000"

[profils.pc-test.slo]
genou_code_agent = 2
genou_fast = 2

[profils.pc-test.slo.vitesse_min]
code-agent = 20.0
fast = 20.0
vision = 10.0

[profils.pc-test.capacite]
niveaux = [1, 2, 4]
longueurs = [2000, 16000, 32000]
duree_palier_s = 60
max_tokens = 256

[profils.pc-test.charge]
paliers = [1, 2, 4]
palier_cible = 2
duree_palier_s = 300
etapes = [8, 15]
contexte_debut = 2000
contexte_fin = 20000
systeme_tokens = 1500
reflexion_s = [5, 20]
max_tokens = 300
prob_rag = 0.3
modele_embeddings = "bge-m3"
max_parallel_par_cle = 2

[profils.pc-test.charge.melange]
code-agent = 1.0

# Phase 3 : à lancer DANS le réseau docker (TEI et le reranker n'ont pas de port publié).
[profils.pc-test.rag]
backend = "tei"
embed = "http://tei-embed"
rerank = "http://tei-rerank"
qdrant = "http://qdrant:6333"
collection = "docs_internes"
questions = "bench/donnees/questions_rag.jsonl"
concurrences = [1, 4, 8]
requetes_par_niveau = 40
candidats_rerank = 50

[profils.pc-test.limites]
role = "code-agent"
requetes_gourmandes = 20
plafond_sans_max_tokens = 8192
concurrence_outils = 4
essais_outils = 20

[[profils.pc-test.pannes]]
nom = "vllm-arret"
role = "code-agent"
consigne = "Arrête vLLM : docker compose stop vllm, attends 20 s, puis docker compose start vllm"
commande = "docker compose stop vllm && sleep 20 && docker compose start vllm"

[[profils.pc-test.pannes]]
nom = "litellm-redemarrage"
role = "code-agent"
consigne = "Redémarre LiteLLM et Postgres : docker compose restart postgres litellm"
commande = "docker compose restart postgres litellm"

[profils.pc-test.qualite]
taches = "bench/donnees/taches"
commande_agent = ["opencode", "run", "--auto"]
modele_agent = ""           # ex. "ia-locale/qwen-local" ; vide = modèle par défaut d'OpenCode
role_vision = ""            # pas de modèle vision sur le PC de test

# ---------------------------------------------------------------------------
# Duo de DGX Spark validé le 09/11/2026 (SPARK-DUO.md, branche spark-duo) :
#   un seul modèle, servi sous le nom qwen-local, réparti sur les deux Spark (tensor parallel 2, Ray) ;
#   Spark 1 (spark-4c7c) : vLLM (tête Ray) + LiteLLM, Postgres, Qdrant, TEI (vLLM pooling), MCP, Caddy ;
#   Spark 2 (spark-19e5) : ray-worker seulement.
#
# À lancer SUR LE SPARK 1, depuis le dossier duo (/home/admin_spark4c7c/data/ws/ia-locale-duo) :
#   - LiteLLM n'écoute que sur 127.0.0.1:4000 (le réseau passe par Caddy en HTTPS) ;
#   - vLLM est sur le réseau de l'hôte, mais le pare-feu ne l'ouvre qu'au câble et à Docker, et il exige
#     VLLM_API_KEY (lue dans .env grâce à cle_env) ;
#   - les commandes des pannes (docker compose …) visent la pile duo de ce dossier.
#
# Le profil de modèle actif (scripts/modeles.py) fixe le contexte et VLLM_MAX_SEQS : à 8 (profils actuels),
# vLLM ne traite jamais plus de 8 requêtes à la fois, et le genou de la phase 1 ne peut pas dépasser 8.
# Les paliers au-delà montrent la file d'attente. Pour viser genou_code_agent (15), monter VLLM_MAX_SEQS.
# ---------------------------------------------------------------------------
[profils.spark]
passerelle = "http://127.0.0.1:4000"
metriques = ["http://127.0.0.1:8000/metrics"]

[profils.spark.roles.code-agent]
modele = "qwen-local"
direct = "http://127.0.0.1:8000"
cle_env = "VLLM_API_KEY"

[profils.spark.capacite]
niveaux = [1, 2, 4, 6, 8, 12, 16]
longueurs = [4000, 32000, 64000]
duree_palier_s = 180
max_tokens = 512

[profils.spark.charge]
paliers = [10, 20, 30, 45]
palier_cible = 30
duree_palier_s = 900
etapes = [15, 30]
contexte_debut = 10000
contexte_fin = 80000
systeme_tokens = 6000
reflexion_s = [5, 30]
max_tokens = 512
prob_rag = 0.2
modele_embeddings = "bge-m3"
max_parallel_par_cle = 4

[profils.spark.charge.melange]
code-agent = 1.0            # un seul modèle en duo

# Dans le réseau Docker du Spark 1 (TEI n'a pas de port publié), voir bench/README.md, phase 3 :
#   docker compose run --rm --no-deps -v ./bench:/b/bench -w /b mcp-docs python -m bench rag --profil spark
[profils.spark.rag]
backend = "vllm"
embed = "http://tei-embed"
rerank = "http://tei-rerank"
qdrant = "http://qdrant:6333"
collection = "docs_internes"
questions = "bench/donnees/questions_rag.jsonl"
concurrences = [1, 8, 16, 32]
requetes_par_niveau = 200
candidats_rerank = 50

[profils.spark.limites]
role = "code-agent"
requetes_gourmandes = 20
plafond_sans_max_tokens = 8192
concurrence_outils = 8
essais_outils = 100

# Pas de modèle de repli en duo : chaque panne coupe le service, on mesure le temps de retour (< 10 min).
[[profils.spark.pannes]]
nom = "vllm-redemarrage"
role = "code-agent"
consigne = "Redémarrage de vLLM sur le Spark 1 (la tête attend le Spark 2 puis recharge le modèle, 2 à 4 min)."
commande = "docker compose restart vllm"

[[profils.spark.pannes]]
nom = "spark2-ray-worker"
role = "code-agent"
consigne = "Redémarrage du ray-worker du Spark 2 : vLLM perd sa moitié du modèle, plante et redémarre seul."
commande = "ssh admin_spark19e5@192.168.100.11 'cd ~/data/ws/ia-locale-duo && docker compose restart ray-worker'"

[[profils.spark.pannes]]
nom = "cable-qsfp"
role = "code-agent"
consigne = "Débranche le câble QSFP entre les deux Spark pendant 60 s, puis rebranche-le."

[[profils.spark.pannes]]
nom = "spark2-redemarrage"
role = "code-agent"
consigne = "Redémarre le Spark 2 (sudo reboot), puis relance son ray-worker si besoin (SPARK-DUO.md, section 6)."

[[profils.spark.pannes]]
nom = "litellm-redemarrage"
role = "code-agent"
consigne = "Redémarrage de Postgres et LiteLLM sur le Spark 1. Aucune clé ne doit être perdue."
commande = "docker compose restart postgres litellm"

# OpenCode tourne sur un poste configuré vers le Spark (installer-opencode.sh) : lancer cette phase depuis le poste.
[profils.spark.qualite]
taches = "bench/donnees/taches"
commande_agent = ["opencode", "run", "--auto"]
modele_agent = ""
role_vision = "code-agent"  # le profil Nemotron 3.5 Super VL lit les images ; vider avec un modèle texte seul
questions_vision = "bench/donnees/questions_vision.jsonl"
