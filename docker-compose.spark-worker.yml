# Spark 2 d'un duo (voir docker-compose.spark-duo.yml et SPARK-DUO.md) : prête son GPU au vLLM du Spark 1.  Validé le 09/11/2026
#
#   Même projet, même .env que le Spark 1, sauf :  COMPOSE_FILE=docker-compose.spark-worker.yml et WS_DIR (le sien)
#   Mêmes poids (WS_DIR/models/<VLLM_MODEL>), même image (VLLM_IMAGE), même .env.vllm que le Spark 1.
#   docker compose up -d
#
# Seul ce conteneur tourne ici : pas de LiteLLM, d'Open WebUI ni d'embeddings, toute la mémoire va au modèle.

x-logs: &logs
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  ray-worker:
    image: ${VLLM_IMAGE}
    entrypoint: ["bash", "/duo/worker.sh"]
    network_mode: host
    ipc: host
    shm_size: 16g
    ulimits:
      memlock: -1
      stack: 67108864
    devices: ["/dev/infiniband:/dev/infiniband"]
    cap_add: [IPC_LOCK]
    # Variables propres au modèle : les processus vLLM lancés ici par Ray doivent voir les mêmes que la tête
    env_file:
      - path: .env.vllm
        required: false
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_HOST_IP: ${DUO_IP_WORKER}
      NCCL_SOCKET_IFNAME: ${DUO_INTERFACE}
      GLOO_SOCKET_IFNAME: ${DUO_INTERFACE}
      TP_SOCKET_IFNAME: ${DUO_INTERFACE}
      UCX_NET_DEVICES: ${DUO_INTERFACE}
      NCCL_IB_HCA: ${DUO_HCA}
      NCCL_IB_DISABLE: "0"
      # RoCE v2 sur IPv4 : index 3 sur le GB10 (vérifier : show_gids). Sans lui, NCCL peut choisir un GID qui ne passe pas
      NCCL_IB_GID_INDEX: ${DUO_GID_INDEX:-3}
      NCCL_DEBUG: ${DUO_NCCL_DEBUG:-WARN}
      RAY_memory_monitor_refresh_ms: "0"
      DUO_IP_TETE: ${DUO_IP_TETE}
      DUO_IP_WORKER: ${DUO_IP_WORKER}
      DUO_RAY_PORT: ${DUO_RAY_PORT:-6379}
    # Mêmes chemins que sur le Spark 1 : Ray y lance des processus vLLM qui relisent /models/<VLLM_MODEL>
    volumes:
      - ${WS_DIR:-./ws}/models:/models:ro
      - ${WS_DIR:-./ws}/loras:/loras:ro
      - ${WS_DIR:-./ws}/cache/vllm:/root/.cache/vllm
      - ${WS_DIR:-./ws}/cache/flashinfer:/root/.cache/flashinfer
      - ${WS_DIR:-./ws}/cache/triton:/root/.triton
      - ./scripts/spark-duo:/duo:ro
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    logging: *logs
    restart: unless-stopped

  # Métriques du Spark 2, lues par le Prometheus du Spark 1 par le câble (ports 9835 et 9100).
  # Réseau de l'hôte : ufw les bloque sur le réseau de l'équipe, le câble est déjà autorisé (SPARK-DUO.md, section 4).
  gpu-exporter:
    image: python:3.12-slim
    command: ["python", "/app/exporter.py"]
    network_mode: host
    volumes: ["./services/gpu-exporter/exporter.py:/app/exporter.py:ro"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu, utility] }]
    logging: *logs
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]
    logging: *logs
    restart: unless-stopped
