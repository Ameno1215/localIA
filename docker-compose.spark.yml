# Surcharge pour le DGX Spark (ARM64, GB10, 128 Go unifiés).  ⚠ NON TESTÉ : à valider sur le Spark.
#
#   cp .env.spark.example .env   (puis remplir les secrets)
#   ./scripts/01-telecharger-modeles.sh --spark
#   docker compose -f docker-compose.yml -f docker-compose.spark.yml up -d
#
# Différences avec le PC :
#  - modèle plus gros (voir .env.spark.example), mêmes noms côté clients (qwen-local, bge-m3)
#  - vLLM réglé d'après les recettes vérifiées GB10 de recipes.vllm.ai, un profil par modèle (scripts/modeles.py)
#  - TEI n'existe pas en ARM64 : embeddings et reranker servis par vLLM (mode pooling), sur GPU
#  - seul Caddy (HTTPS) est joignable depuis le réseau : LiteLLM sur / (443), normes (MCP) sur /mcp avec jeton,
#    Open WebUI sur le port 8443
#  - le serveur MCP n'expose que rechercher_docs (OUTILS_CODE=0) : les agents travaillent sur les postes
#
# Configuration (compose, config/, scripts) = dossier du projet ; DONNÉES (modèles, caches, bases, documents) = WS_DIR (défaut ./ws).
#
# Toutes les images utilisées existent en arm64 (vérifié le 20/10/2026), sauf TEI, remplacé ici.

x-vllm-pooling: &vllm-pooling
  image: ${VLLM_POOLING_IMAGE:-vllm/vllm-openai:v0.30.0}
  entrypoint: ["vllm", "serve"]
  environment:
    HF_HUB_OFFLINE: "1"
  volumes: ["${WS_DIR:-./ws}/models:/models:ro"]
  ipc: host
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  restart: unless-stopped

services:
  # Les options propres au modèle (parsers, backends, MTP…) viennent du profil actif :
  # config/modeles-spark/<nom>.env, copié dans .env par  ./scripts/modeles.py utiliser <nom>
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    command: >
      /models/${VLLM_MODEL}
      --served-model-name qwen-local
      --host 0.0.0.0 --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN}
      --gpu-memory-utilization ${VLLM_GPU_UTIL}
      --max-num-seqs ${VLLM_MAX_SEQS}
      --enable-auto-tool-choice --tool-call-parser ${VLLM_TOOL_PARSER:-qwen3_coder}
      ${VLLM_SPEC_ARGS:-}
      ${VLLM_EXTRA_ARGS:-}
      ${VLLM_LORA_ARGS:-}
    # Variables d'environnement propres au modèle (écrites par « utiliser »)
    env_file:
      - path: .env.vllm
        required: false
    # Pas de VLLM_USE_RUST_FRONTEND : le frontend Rust refuse --media-io-kwargs / --mm-processor-cache-gb (profil Nemotron)
    # et ignore --enable-auto-tool-choice (appels d'outils cassés). Les recettes NVIDIA gardent le frontend Python.
    # Contrôle de santé sans curl (absent de certaines images) ; un gros modèle met longtemps à charger
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60m
    # Comme dans toutes les recettes NVIDIA : mémoire partagée, mémoire verrouillée, caches de compilation persistants
    shm_size: 16g
    ulimits:
      memlock: -1
      stack: 67108864
    volumes: !override
      - ${WS_DIR:-./ws}/models:/models:ro
      - ${WS_DIR:-./ws}/loras:/loras:ro
      - ${WS_DIR:-./ws}/cache/vllm:/root/.cache/vllm
      - ${WS_DIR:-./ws}/cache/flashinfer:/root/.cache/flashinfer
      - ${WS_DIR:-./ws}/cache/triton:/root/.triton
    ports: !override
      - "127.0.0.1:8000:8000"

  tei-embed:
    <<: *vllm-pooling
    command: >
      /models/bge-m3 --served-model-name bge-m3 --runner pooling
      --host 0.0.0.0 --port 80 --gpu-memory-utilization 0.04 --max-model-len 8192

  tei-rerank:
    <<: *vllm-pooling
    command: >
      /models/bge-reranker-v2-m3 --served-model-name bge-reranker --runner pooling
      --host 0.0.0.0 --port 80 --gpu-memory-utilization 0.04 --max-model-len 8192

  mcp-docs:
    environment:
      OUTILS_CODE: "0"
      RAG_BACKEND: vllm
    ports: !reset []
    volumes: !override
      - ${WS_DIR:-./ws}/docs-internes:/docs:ro
      - ${WS_DIR:-./ws}/workspace:/workspace
      - ./finetune:/finetune:ro
      - ${WS_DIR:-./ws}/data:/data

  # Données persistantes dans WS_DIR (et non dans des volumes cachés du stockage Docker)
  postgres:
    volumes: !override
      - ${WS_DIR:-./ws}/postgres:/var/lib/postgresql/data

  qdrant:
    volumes: !override
      - ${WS_DIR:-./ws}/qdrant:/qdrant/storage

  litellm:
    ports: !override
      - "127.0.0.1:4000:4000"

  # OPEN_WEBUI_HTTP=0.0.0.0 dans .env : Open WebUI aussi en HTTP simple sur le réseau (http://<ip>:3000),
  # sans nom ni certificat, mais mots de passe et conversations en clair. Défaut : local au Spark seulement.
  open-webui:
    ports: !override
      - "${OPEN_WEBUI_HTTP:-127.0.0.1}:3000:8080"
    volumes: !override
      - ${WS_DIR:-./ws}/open-webui:/app/backend/data

  # Seule porte d'entrée réseau. Certificat interne : distribuer la CA aux postes (voir GUIDE.md).
  caddy:
    image: caddy:2.10.2
    environment:
      SPARK_HOSTNAME: ${SPARK_HOSTNAME}
      MCP_TOKEN: ${MCP_TOKEN}
    volumes:
      - ./config/Caddyfile.spark:/etc/caddy/Caddyfile:ro
      - ${WS_DIR:-./ws}/caddy:/data
    ports: ["443:443", "8443:8443"]
    depends_on: [litellm, mcp-docs, open-webui]
    restart: unless-stopped
